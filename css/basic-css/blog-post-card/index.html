<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="blog-post-card">

    <img 
        class="post-img"
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="Laptop and notebook on a desk"
    >

    <div class="post-content">
        <h2 class="post-title">How I Stay Consistent Learning Code</h2>

        <p class="post-excerpt">
            Small daily practice beats rare long sessions. Here are simple
            techniques that help you build real coding momentum.
        </p>

        <a class="read-more" href="#">Read More</a>
    </div>

</div>

</body>
</html>
