<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>My To-Do List</h1>

<ul class="todo-list">

    <li>
        <input type="checkbox" id="task1">
        <label for="task1">Learn CSS link states</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/CSS/:hover" target="_blank">
                    Read about :hover
                </a>
            </li>
        </ul>
    </li>

    <li>
        <input type="checkbox" id="task2">
        <label for="task2">Practice pseudo-classes</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/CSS/Pseudo-classes" target="_blank">
                    CSS pseudo-classes guide
                </a>
            </li>
        </ul>
    </li>

    <li>
        <input type="checkbox" id="task3">
        <label for="task3">Build small projects</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">
                    FreeCodeCamp projects
                </a>
            </li>
        </ul>
    </li>

    <li>
        <input type="checkbox" id="task4">
        <label for="task4">Review accessibility</label>

        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="https://www.w3.org/WAI/fundamentals/accessibility-intro/" target="_blank">
                    Accessibility basics
                </a>
            </li>
        </ul>
    </li>

</ul>

</body>
</html>
