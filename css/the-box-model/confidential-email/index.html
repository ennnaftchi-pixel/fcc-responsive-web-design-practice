  <title>Confidential Email</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main id="email">
    <div id="confidential">CONFIDENTIAL</div>
    <div id="top-secret">TOP SECRET</div>

    <p>
      Dear Agent, the access code is
      <span class="blurred">7391-XA</span>
      and must not be shared.
    </p>

    <p>
      The meeting location is
      <span class="blurred">Sector 12 Warehouse</span>
      at exactly midnight.
    </p>

    <p>
      Your contact is known as
      <span class="blurred">Raven</span>
      — trust no one else.
    </p>
  </main>

</body>
