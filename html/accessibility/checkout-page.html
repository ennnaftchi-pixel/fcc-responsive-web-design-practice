<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
</head>
<body>
  <main>
    <h1>Checkout</h1>

    <!-- Your Cart Section -->
    <section>
      <h2>Your Cart</h2>
      <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Item in your cart">
    </section>

    <!-- Payment Information Section -->
    <section>
      <h2>Payment Information</h2>
      <form>
        <!-- Card Name -->
        <label for="card-name">Card Name <span aria-hidden="true">*</span></label>
        <input type="text" id="card-name" name="card-name" required>

        <!-- Card Number -->
        <label for="card-number">Card Number <span aria-hidden="true">*</span></label>
        <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
        <p id="card-number-help">Enter your card number in the format XXXX-XXXX-XXXX-XXXX.</p>

        <!-- Submit button -->
        <input type="submit" value="Submit Payment">
      </form>
    </section>
  </main>
</body>
</html>
