<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Survey Form</title>
</head>
<body>
  <main>
    <h1 id="title">Feedback Survey</h1>
    <p id="description">We’d love to hear your thoughts! Please fill out this quick survey.</p>

    <form id="survey-form">
      <!-- Name -->
      <label for="name" id="name-label">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <!-- Email -->
      <label for="email" id="email-label">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <!-- Age -->
      <label for="number" id="number-label">Age:</label>
      <input type="number" id="number" name="age" placeholder="Enter your age" min="10" max="100">

      <!-- Dropdown -->
      <label for="dropdown">Favorite Topic:</label>
      <select id="dropdown" name="topic">
        <option value="">Select a topic</option>
        <option value="tech">Technology</option>
        <option value="nature">Nature</option>
        <option value="music">Music</option>
      </select>

      <!-- Radio Buttons -->
      <fieldset>
        <legend>How did you hear about us?</legend>
        <input type="radio" id="radio1" name="source" value="friend">
        <label for="radio1">Friend</label>
        <input type="radio" id="radio2" name="source" value="internet">
        <label for="radio2">Internet</label>
      </fieldset>

      <!-- Checkboxes -->
      <fieldset>
        <legend>Which of these do you like? (Select all that apply)</legend>
        <input type="checkbox" id="check1" name="likes" value="videos">
        <label for="check1">Videos</label>
        <input type="checkbox" id="check2" name="likes" value="articles">
        <label for="check2">Articles</label>
        <input type="checkbox" id="check3" name="likes" value="podcasts">
        <label for="check3">Podcasts</label>
      </fieldset>

      <!-- Textarea -->
      <label for="comments">Additional Comments:</label>
      <textarea id="comments" name="comments" placeholder="Your thoughts..."></textarea>

      <!-- Submit -->
      <button type="submit" id="submit">Submit</button>
    </form>
  </main>
</body>
</html>
